<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | Student Portal</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<button
    id="themeToggle"
    class="floating-toggle"
    aria-label="Toggle theme"
>
    <span id="themeIcon">☀️</span>
</button>


<div class="container">

    <div class="card">


        <!-- Header -->

        <div class="card-header">

            <span class="eyebrow">
                HOSTEL DASHBOARD
            </span>

            <h1>
                Create Account
            </h1>

            <p>
                Create your account using your
                college enrollment ID.
            </p>

        </div>



        <!-- Registration Form -->

        <form id="registerForm">


            <!-- Enrollment ID -->

            <div
                class="input-group"
                id="enrollmentIdGroup"
            >

                <label for="enrollmentId">
                    Enrollment ID
                </label>

                <input
                    type="text"
                    id="enrollmentId"
                    placeholder="Enter your enrollment ID"
                    autocomplete="username"
                    required
                >

                <span
                    id="enrollmentIdHint"
                    class="field-hint"
                ></span>

            </div>



            <!-- Email -->

            <div
                class="input-group"
                id="emailGroup"
            >

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

                <span class="field-hint">
                    Used only to send a password reset link if you ever get locked out.
                </span>

            </div>



            <!-- Password -->

            <div
                class="input-group"
                id="passwordGroup"
            >

                <label for="password">
                    Password
                </label>

                <div class="password-field">

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="password-toggle"
                        aria-label="Show password"
                        aria-pressed="false"
                        tabindex="-1"
                    >

                        <svg
                            class="eye-icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />

                            <circle cx="12" cy="12" r="3" />

                        </svg>

                    </button>

                </div>

                <span
                    id="passwordHint"
                    class="field-hint"
                >
                    At least 8 characters.
                </span>

            </div>



            <!-- Confirm Password -->

            <div
                class="input-group"
                id="confirmPasswordGroup"
            >

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="password-field">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        id="toggleConfirmPassword"
                        class="password-toggle"
                        aria-label="Show password"
                        aria-pressed="false"
                        tabindex="-1"
                    >

                        <svg
                            class="eye-icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />

                            <circle cx="12" cy="12" r="3" />

                        </svg>

                    </button>

                </div>

                <span
                    id="confirmPasswordHint"
                    class="field-hint"
                ></span>

            </div>



            <!-- Message -->

            <p id="message"></p>



            <!-- Submit -->

            <button
                type="submit"
                id="registerBtn"
            >
                Create Account
            </button>


        </form>



        <!-- Login -->

        <div class="login-link">

            Already have an account?

            <a href="index.html">
                Login
            </a>

        </div>


    </div>

</div>


<script src="theme.js"></script>
<script src="register.js"></script>

</body>

</html>
