<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Registered Students</title>
<link rel="stylesheet" href="admin-dashboard.css">
</head>
<body>

  <div class="topbar">
    <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">
      <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" fill="var(--moon-fill)"/>
      </svg>
    </button>
    <div class="account-wrapper">
      <button class="icon-btn" id="accountBtn" aria-label="Account" aria-haspopup="true" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--user-stroke)" stroke-width="1.8">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
        </svg>
      </button>

      <div class="account-dropdown" id="accountDropdown">
        <div class="account-dropdown-header">
          <div class="account-avatar">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--user-stroke)" stroke-width="1.8">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
            </svg>
          </div>
          <div class="account-info">
            <span class="account-name">Admin</span>
            <span class="account-id" id="accountId">ID: —</span>
          </div>
        </div>

        <hr class="account-divider">

        <div class="account-menu">
          <button class="account-menu-item logout" id="logoutBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <path d="M16 17l5-5-5-5"/>
              <path d="M21 12H9"/>
            </svg>
            <span>Logout</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <main class="page">
    <h1>Registered Students</h1>

    <div class="controls">
      <input class="search-input" type="text" placeholder="Search by name, enrollment ID, or email...">
      <button class="refresh-btn" id="refreshBtn">Refresh</button>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Enrollment ID</th>
            <th>Name</th>
            <th>Gender</th>
            <th>Course</th>
            <th>Year</th>
            <th>Home Location</th>
            <th>Room Type</th>
            <th>Status</th>
            <th>Room</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr class="error-row">
            <td colspan="9">Something went wrong.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="admin-dashboard.js"></script>
</body>
</html>
