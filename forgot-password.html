<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | Student Portal</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<button
    id="themeToggle"
    class="floating-toggle"
    aria-label="Toggle theme"
>
    <span id="themeIcon">☀️</span>
</button>


<div class="container">

    <div class="card">


        <!-- Header -->

        <div class="card-header">

            <span class="eyebrow">
                HOSTEL DASHBOARD
            </span>

            <h1>
                Forgot Password
            </h1>

            <p>
                Enter your Enrollment ID and we'll email a reset
                link to the address on file for your account.
            </p>

        </div>



        <!-- Form -->

        <form id="forgotPasswordForm">


            <!-- Enrollment ID -->

            <div class="input-group">

                <label for="enrollmentId">
                    Enrollment ID
                </label>

                <input
                    type="text"
                    id="enrollmentId"
                    placeholder="Enter your enrollment ID"
                    autocomplete="username"
                    required
                >

            </div>



            <!-- Message -->

            <p id="message"></p>



            <!-- Submit -->

            <button
                type="submit"
                id="submitBtn"
            >
                Send Reset Link
            </button>


        </form>



        <!-- Back to login -->

        <div class="login-link">

            Remembered your password?

            <a href="index.html">
                Back to login
            </a>

        </div>


    </div>

</div>


<script src="theme.js"></script>
<script src="forgot-password.js"></script>

</body>

</html>
