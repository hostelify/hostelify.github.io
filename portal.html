<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hostel Allocation</title>

    <link
        rel="stylesheet"
        href="portal.css"
    >

</head>


<body>


<div class="portal-container">


    <!-- ========================================= -->
    <!-- TOP NAVBAR -->
    <!-- ========================================= -->

    <nav class="portal-nav">


        <!-- BRAND -->

        <div class="brand">

            

            <div class="brand-text">

                

            </div>

        </div>


        <!-- NAV ACTIONS -->

        <div class="nav-actions">


            <!-- THEME -->

            <button
                id="themeToggle"
                class="theme-toggle"
                type="button"
                aria-label="Toggle theme"
                title="Toggle theme"
            >

                <span
                    id="themeIcon"
                    aria-hidden="true"
                >
                    ☀️
                </span>

            </button>

            <!-- NOTIFICATIONS -->

<button
    id="notificationBtn"
    class="notification-btn"
    type="button"
    aria-label="Notifications"
    title="Notifications"
>

    <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
    >

        <path
            d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
        />

        <path
            d="M10 21h4"
        />

    </svg>

    <!-- Notification badge -->
    <span
        id="notificationBadge"
        class="notification-badge"
        style="display:none;"
    >
        0
    </span>

</button>


            <!-- USER MENU -->

            <div
                class="user-menu"
                id="userMenu"
            >

                <button
                    class="user-menu-btn"
                    id="userMenuBtn"
                    type="button"
                    aria-label="Open account menu"
                    aria-expanded="false"
                    aria-haspopup="true"
                >

                    <span class="user-avatar">

                        <svg
                            viewBox="0 0 48 48"
                            aria-hidden="true"
                            class="user-avatar-icon"
                        >

                            <circle
                                cx="24"
                                cy="17"
                                r="8"
                            />

                            <path
                                d="M8 40c1.8-8.1 7.7-12 16-12s14.2 3.9 16 12"
                            />

                        </svg>

                    </span>

                </button>


                <!-- DROPDOWN -->

                <div
                    class="user-dropdown"
                    id="userDropdown"
                    role="menu"
                    aria-hidden="true"
                >


                    <div class="dropdown-account">

                        <span class="dropdown-avatar">

                            <svg
                                viewBox="0 0 48 48"
                                aria-hidden="true"
                            >

                                <circle
                                    cx="24"
                                    cy="17"
                                    r="8"
                                />

                                <path
                                    d="M8 40c1.8-8.1 7.7-12 16-12s14.2 3.9 16 12"
                                />

                            </svg>

                        </span>


                        <div class="dropdown-account-info">

                            <strong>
                                Student Account
                            </strong>

                            <span id="dropdownEnrollmentText">
                                Student Portal
                            </span>

                        </div>

                    </div>


                    <div class="dropdown-divider"></div>


                    <!-- ADMIN LOGIN -->

                    <a
                        href="admin-login.html"
                        id="dropdownAdminLoginBtn"
                        class="dropdown-admin-link"
                        role="menuitem"
                    >

                        <span class="admin-link-icon">

                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >

                                <path d="M12 2l8 4v6c0 5-3.4 8.5-8 10-4.6-1.5-8-5-8-10V6l8-4z" />

                                <path d="M9.5 12.5l1.8 1.8 3.2-3.6" />

                            </svg>

                        </span>


                        <span class="admin-link-text">
                            Admin Login
                        </span>

                    </a>


                    <!-- LOGOUT -->

                    <button
                        type="button"
                        id="dropdownLogoutBtn"
                        class="dropdown-logout"
                        role="menuitem"
                    >

                        <span class="logout-icon">

                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >

                                <path d="M9 5H5v14h4" />

                                <path d="M14 8l4 4-4 4" />

                                <path d="M18 12H9" />

                            </svg>

                        </span>


                        <span class="logout-text">
                            Logout
                        </span>

                    </button>


                </div>

            </div>

        </div>

    </nav>



    <!-- ========================================= -->
    <!-- MAIN -->
    <!-- ========================================= -->

    <main class="portal-main">


        <section
            class="hostel-registration"
            id="hostelRegistration"
        >


            <!-- ================================= -->
            <!-- HEADER -->
            <!-- ================================= -->

            <div class="hostel-registration-header">

                <div>

                    <h1>
                        Hostel Registration
                    </h1>

                    
                </div>

            </div>




                


            <!-- ================================= -->
            <!-- REGISTRATION FORM -->
            <!-- ================================= -->

            <form
                id="hostelForm"
                class="portal-hostel-form"
            >


                <!-- PERSONAL INFORMATION -->

                <div class="form-section">



                    <div class="form-grid">


                        <div class="form-field">

                            <label for="enrollmentId">
                                Student ID
                            </label>

                            <input
                                type="text"
                                id="enrollmentId"
                                name="enrollmentId"
                                placeholder="Your enrollment ID"
                                autocomplete="off"
                                readonly
                            >

                        </div>


                        <div class="form-field">

                            <label for="fullName">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="fullName"
                                name="fullName"
                                placeholder="Enter your full name"
                                required
                            >

                        </div>


                        <div class="form-field">

                            <label for="email">
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                required
                            >

                        </div>


                        


                        <div class="form-field">

                            <label for="gender">
                                Gender
                            </label>

                            <select
                                id="gender"
                                name="gender"
                                required
                            >

                                <option value="">
                                    Select gender
                                </option>

                                <option value="Male">
                                    Male
                                </option>

                                <option value="Female">
                                    Female
                                </option>

                               

                            </select>

                        </div>


                        


                        <div class="form-field">

                            <label for="course">
                                Course / Branch
                            </label>

                            <input
                                type="text"
                                id="course"
                                name="course"
                                placeholder="e.g. B.Tech CSE"
                                required
                            >

                        </div>


                        <div class="form-field">

                            <label for="homeLocation">
                                State
                            </label>

                            <select
                                id="homeLocation"
                                name="homeLocation"
                                required
                            >

                                <option value="">
                                    Select location
                                </option>

                                <option value="Delhi">
                                    Delhi
                                </option>

                                <option value="Outside Delhi">
                                    Outside Delhi
                                </option>

                             

                            </select>

                        </div>


                    </div>

                </div>


                <!-- PARENT / GUARDIAN DETAILS -->

                <div class="form-section">



                    <div class="form-grid">


                        




                        

                        


                        <div class="form-field">

                            <label for="pinCode">
                                PIN Code
                            </label>

                            <input
                                type="text"
                                id="pinCode"
                                name="pinCode"
                                placeholder="Enter PIN code"
                                inputmode="numeric"
                                required
                            >

                        </div>

                        <div class="form-field">

                            <label for="gender">
                                Physically Disabled?
                            </label>

                            <select
                                id="gender"
                                name="gender"
                                required
                            >

                                <option value="">
                                    Select Option
                                </option>

                                <option value="Male">
                                    Yes
                                </option>

                                <option value="Female">
                                    No
                                </option>

                               

                            </select>

                        </div>
                        


                        

                    </div>

                </div>


                <!-- HOSTEL INFORMATION -->

                <div class="form-section">

                    


                    <div class="form-grid">


                        <div class="form-field">

                            <label for="roomType">
                                Room Type
                            </label>

                            <select
                                id="roomType"
                                name="roomType"
                                required
                            >

                                <option value="">
                                    Select room type
                                </option>

                                <option value="Single">
                                    Single Sharing
                                </option>

                                <option value="Double">
                                    Double Sharing
                                </option>

                              

                            </select>

                        </div>


                        <div class="form-field">

                            <label for="academicYear">
                                Academic Year
                            </label>

                            <select
                                id="academicYear"
                                name="academicYear"
                                required
                            >

                                <option value="">
                                    Select year
                                </option>

                                <option value="1st Year">
                                    1st Year
                                </option>

                                <option value="2nd Year">
                                    2nd Year
                                </option>

                                <option value="3rd Year">
                                    3rd Year
                                </option>

                                <option value="4th Year">
                                    4th Year
                                </option>

                            </select>

                        </div>


                    </div>

                </div>



                <!-- DECLARATION -->

                <div class="registration-declaration">

    <input
        type="checkbox"
        id="declaration"
        name="declaration"
        required
    >

    <label for="declaration">
        I confirm that the information provided above
        is accurate and complete. I understand that
        the information will be stored for hostel
        allocation and administrative purposes.
    </label>

</div>



                <!-- MESSAGE -->

                <p
                    id="hostelMessage"
                    class="hostel-form-message"
                ></p>



                <!-- FOOTER -->

                <div class="registration-footer">

                    <div>

                       
                    </div>


                    <button
                        type="submit"
                        id="submitHostelBtn"
                        class="submit-hostel-btn"
                    >

                        <span>
                            Save Registration
                        </span>

                        <span>
                            →
                        </span>

                    </button>

                </div>


            </form>


        </section>

 



    </main>


</div>


<script src="portal.js"></script>

</body>

</html>
