<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password | Student Portal</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<button
    id="themeToggle"
    class="floating-toggle"
    aria-label="Toggle theme"
>
    <span id="themeIcon">☀️</span>
</button>


<div class="container">

    <div class="card">


        <!-- Header -->

        <div class="card-header">

            <span class="eyebrow">
                HOSTEL DASHBOARD
            </span>

            <h1>
                Reset Password
            </h1>

            <p>
                Choose a new password for your account.
            </p>

        </div>



        <!-- Form -->

        <form id="resetPasswordForm">


            <!-- New Password -->

            <div class="input-group">

                <label for="newPassword">
                    New Password
                </label>

                <div class="password-field">

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter a new password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        id="toggleNewPassword"
                        class="password-toggle"
                        aria-label="Show password"
                        aria-pressed="false"
                        tabindex="-1"
                    >

                        <svg
                            class="eye-icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />

                            <circle cx="12" cy="12" r="3" />

                        </svg>

                    </button>

                </div>

                <span
                    id="passwordHint"
                    class="field-hint"
                >
                    At least 8 characters.
                </span>

            </div>



            <!-- Confirm Password -->

            <div class="input-group">

                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <div class="password-field">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your new password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        id="toggleConfirmPassword"
                        class="password-toggle"
                        aria-label="Show password"
                        aria-pressed="false"
                        tabindex="-1"
                    >

                        <svg
                            class="eye-icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />

                            <circle cx="12" cy="12" r="3" />

                        </svg>

                    </button>

                </div>

                <span
                    id="confirmHint"
                    class="field-hint"
                ></span>

            </div>



            <!-- Message -->

            <p id="message"></p>



            <!-- Submit -->

            <button
                type="submit"
                id="submitBtn"
            >
                Reset Password
            </button>


        </form>



        <!-- Back to login -->

        <div class="login-link">

            <a href="index.html">
                Back to login
            </a>

        </div>


    </div>

</div>


<script src="theme.js"></script>
<script src="reset-password.js"></script>

</body>

</html>
